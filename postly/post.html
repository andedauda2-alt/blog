<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Post — Postly" />
  <title>Post — Postly</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .post-detail-page .main-content { margin-right: 0; }
    .post-detail-container { max-width: 680px; margin: 0 auto; padding-bottom: 80px; }
    .comments-section-standalone { padding: 20px 24px; }
    .comments-section-standalone h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px; color: var(--color-text-primary); }
  </style>
</head>
<body class="post-detail-page">

  <!-- ===== MOBILE HEADER ===== -->
  <header class="mobile-header" role="banner">
    <button class="back-btn" onclick="window.history.back()" aria-label="Go back">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="logo-text">Post<span>ly</span></div>
    <div class="header-avatar" id="header-avatar" aria-label="Your profile" role="button" tabindex="0"
      onclick="window.location.href='profile.html'">?</div>
  </header>

  <div class="app-wrapper">

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar-left" aria-label="Main navigation">
      <div class="sidebar-logo" role="banner">
        <div class="logo-icon">P</div>
        <div class="logo-text">Post<span>ly</span></div>
      </div>
      <nav class="sidebar-nav" aria-label="Primary navigation">
        <button class="nav-item" onclick="window.location.href='index.html'">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span>Home</span>
        </button>
        <button class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <span>Explore</span>
        </button>
        <button class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
          <span>Notifications</span>
        </button>
        <button class="nav-item" onclick="window.location.href='create.html'">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>
          <span>Create Post</span>
        </button>
        <button class="nav-item" onclick="window.location.href='profile.html'">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <span>Profile</span>
        </button>
      </nav>
      <div class="sidebar-user" onclick="window.location.href='profile.html'" role="button" tabindex="0">
        <div class="user-avatar" id="sidebar-user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
          <div class="sidebar-user-handle" id="sidebar-user-handle">@user</div>
        </div>
      </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="main-content" role="main" style="margin-right:0">

      <div class="page-header">
        <button class="back-btn" onclick="window.history.back()" aria-label="Go back">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="page-header-info"><h1>Post</h1></div>
      </div>

      <div class="post-detail-container">
        <div id="post-detail-content">
          <div class="spinner" role="status" aria-label="Loading post"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <div class="bottom-nav-items">
      <a class="bottom-nav-item" href="index.html" aria-label="Home">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>Home</span>
      </a>
      <a class="bottom-nav-item" href="index.html" aria-label="Explore">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <span>Explore</span>
      </a>
      <a class="bottom-nav-item create-btn-mobile" href="create.html" aria-label="Create">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
      <a class="bottom-nav-item" href="profile.html" aria-label="Profile">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>Profile</span>
      </a>
      <a class="bottom-nav-item" href="#" aria-label="Notifications" onclick="event.preventDefault();">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
        <span>Alerts</span>
      </a>
    </div>
  </nav>

  <div id="toast-container" class="toast-container" role="region" aria-live="assertive"></div>

  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/users.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/comments.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initializeSampleData();
      const currentUser = getCurrentUser();
      setupSidebarUser(currentUser);
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');
      if (!postId) { showError('No post ID provided.'); return; }
      const post = getPostById(postId);
      if (!post) { showError('Post not found. It may have been deleted.'); return; }
      renderPostDetail(post, currentUser);
    });

    function setupSidebarUser(user) {
      if (!user) return;
      const color = user.avatarColor || getAvatarColor(user.id);
      const initials = getInitials(user.displayName);
      document.getElementById('header-avatar').textContent = initials;
      document.getElementById('header-avatar').style.background = color;
      const sav = document.getElementById('sidebar-user-avatar');
      if (sav) { sav.textContent = initials; sav.style.background = color; }
      const sn = document.getElementById('sidebar-user-name');
      if (sn) sn.textContent = user.displayName;
      const sh = document.getElementById('sidebar-user-handle');
      if (sh) sh.textContent = '@' + user.handle;
    }

    function showError(msg) {
      document.getElementById('post-detail-content').innerHTML = `
        <div class="empty-state" style="padding:80px 20px">
          <div class="empty-state-icon">${icon('xCircle', {size:48})}</div>
          <h3>Post Not Found</h3>
          <p>${escapeHtml(msg)}</p>
          <a href="index.html" class="btn btn-primary" style="margin-top:16px">
            ${icon('arrowLeft', {size:14})} Back to Feed
          </a>
        </div>`;
    }

    function renderPostDetail(post, currentUser) {
      const author = getUserById(post.authorId);
      if (!author) { showError('Author not found.'); return; }

      const container = document.getElementById('post-detail-content');
      const color = author.avatarColor || getAvatarColor(author.id);
      const initials = getInitials(author.displayName);
      const liked = currentUser ? hasLiked(post.id, currentUser.id) : false;
      const reposted = currentUser ? hasReposted(post.id, currentUser.id) : false;
      const isOwn = currentUser && post.authorId === currentUser.id;
      const commentCount = getCommentsByPost(post.id).length;
      const cuColor = currentUser ? (currentUser.avatarColor || getAvatarColor(currentUser.id)) : '#6c63ff';
      const cuInitials = currentUser ? getInitials(currentUser.displayName) : '?';

      document.title = `${author.displayName} on Postly`;

      const tagsHTML = post.tags && post.tags.length
        ? `<div class="post-tags" style="margin-top:12px">${post.tags.map(t =>
            `<a href="index.html?search=${encodeURIComponent(t.replace('#',''))}" class="post-tag" style="margin-right:6px">${escapeHtml(t)}</a>`
          ).join('')}</div>`
        : '';

      const postImageHTML = post.image
        ? `<div class="post-image" style="margin:16px 0"><img src="${post.image}" alt="Post image" style="width:100%;max-height:500px;object-fit:cover;border-radius:12px" onerror="this.parentElement.style.display='none'"></div>`
        : '';

      container.innerHTML = `
        <article class="post-detail-card" aria-label="Post by ${escapeHtml(author.displayName)}">

          <div class="post-header" style="margin-bottom:16px">
            <div class="post-author">
              <a href="profile.html?user=${author.id}" class="post-avatar"
                style="background:${color};width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;text-decoration:none"
                aria-label="${escapeHtml(author.displayName)}">${initials}</a>
              <div class="post-author-info" style="margin-left:12px">
                <a href="profile.html?user=${author.id}" style="font-size:17px;font-weight:700;color:var(--color-text-primary);text-decoration:none">${escapeHtml(author.displayName)}</a>
                <div style="font-size:13px;color:var(--color-text-muted)">@${escapeHtml(author.handle)}</div>
              </div>
            </div>
            ${isOwn ? `<div style="position:relative"><button class="post-menu-btn" id="detail-menu-btn" aria-label="Post options">${icon('moreHorizontal')}</button></div>` : ''}
          </div>

          <div class="post-detail-content">
            <p style="font-size:18px;line-height:1.7;color:var(--color-text-primary);white-space:pre-wrap;word-break:break-word">${escapeHtml(post.content)}</p>
            ${tagsHTML}
            ${postImageHTML}
          </div>

          <div class="post-detail-meta" style="margin-top:16px;display:flex;align-items:center;gap:6px">
            ${icon('clock')} ${formatFullDate(post.createdAt)}
            ${post.editedAt ? ` &middot; <em>Edited ${formatTime(post.editedAt)}</em>` : ''}
          </div>

          <div class="post-detail-stats">
            <div class="post-detail-stat"><strong id="detail-stat-likes">${formatCount(post.likes)}</strong> Likes</div>
            <div class="post-detail-stat"><strong id="comment-count-display">${commentCount}</strong> Comments</div>
            <div class="post-detail-stat"><strong>${formatCount(post.reposts)}</strong> Reposts</div>
          </div>

          <div class="post-actions" style="margin-top:4px">
            <button class="action-btn like-btn ${liked ? 'liked' : ''}" id="detail-like-btn"
              aria-label="${liked ? 'Unlike' : 'Like'} post" aria-pressed="${liked}">
              <span class="action-icon" id="detail-like-icon">${liked ? icon('heartFilled') : icon('heart')}</span>
              <span id="detail-like-count">${formatCount(post.likes)}</span>
            </button>
            <button class="action-btn comment-btn" id="detail-comment-btn" aria-label="Comment on post">
              <span class="action-icon">${icon('messageCircle')}</span>
              <span>Comment</span>
            </button>
            <button class="action-btn repost-btn ${reposted ? 'reposted' : ''}" id="detail-repost-btn"
              aria-label="Repost" aria-pressed="${reposted}">
              <span class="action-icon">${icon('repeat')}</span>
              <span>Repost</span>
            </button>
            <button class="action-btn share-btn" id="detail-share-btn" aria-label="Share post">
              <span class="action-icon">${icon('share')}</span>
              <span>Share</span>
            </button>
          </div>
        </article>

        <section class="comments-section-standalone" aria-label="Comments">
          <h2>Comments</h2>
          <div class="comment-input-wrap" style="margin-bottom:20px">
            <div style="width:40px;height:40px;border-radius:50%;background:${cuColor};display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0">${cuInitials}</div>
            <textarea class="comment-input" id="detail-comment-input"
              placeholder="Share your thoughts..." maxlength="280" rows="2" aria-label="Write a comment"></textarea>
            <button class="comment-submit-btn" id="detail-comment-submit" aria-label="Post comment">
              ${icon('send')}
            </button>
          </div>
          <div id="comments-list-detail"></div>
        </section>
      `;

      // Like
      document.getElementById('detail-like-btn').addEventListener('click', () => {
        if (!currentUser) { showToast('Log in to like posts', 'warning'); return; }
        const nowLiked = toggleLike(post.id, currentUser.id);
        const posts = getPosts();
        const lp = posts.find(p => p.id === post.id);
        if (lp) {
          lp.likes = nowLiked ? lp.likes + 1 : Math.max(0, lp.likes - 1);
          savePosts(posts);
          document.getElementById('detail-like-count').textContent = formatCount(lp.likes);
          const statLikes = document.getElementById('detail-stat-likes');
          if (statLikes) statLikes.textContent = formatCount(lp.likes);
        }
        const likeIcon = document.getElementById('detail-like-icon');
        likeIcon.innerHTML = nowLiked ? icon('heartFilled') : icon('heart');
        document.getElementById('detail-like-btn').classList.toggle('liked', nowLiked);
        document.getElementById('detail-like-btn').setAttribute('aria-pressed', nowLiked);
        showToast(nowLiked ? 'Post liked' : 'Post unliked', nowLiked ? 'success' : 'info', 2000);
      });

      document.getElementById('detail-comment-btn').addEventListener('click', () => {
        document.getElementById('detail-comment-input').focus();
        document.getElementById('detail-comment-input').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      document.getElementById('detail-repost-btn').addEventListener('click', () => {
        if (!currentUser) { showToast('Log in to repost', 'warning'); return; }
        openRepostModal(post, currentUser);
      });

      document.getElementById('detail-share-btn').addEventListener('click', () => {
        openShareModal(post);
      });

      if (isOwn) {
        document.getElementById('detail-menu-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openDropdown(document.getElementById('detail-menu-btn'), [
            { icon: icon('pencil'), label: 'Edit post', action: () => window.location.href = `create.html?edit=${post.id}` },
            { icon: icon('trash'), label: 'Delete post', danger: true, action: () => {
              if (confirm('Delete this post?')) {
                deletePost(post.id);
                showToast('Post deleted', 'info');
                setTimeout(() => window.location.href = 'index.html', 1000);
              }
            }},
          ]);
        });
      }

      const commentsListEl = document.getElementById('comments-list-detail');
      renderCommentsSection(post.id, commentsListEl, currentUser);
      setupDetailCommentInput(
        post.id,
        document.getElementById('detail-comment-input'),
        document.getElementById('detail-comment-submit'),
        commentsListEl,
        currentUser
      );
    }
  </script>

</body>
</html>
