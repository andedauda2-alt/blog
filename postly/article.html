<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Article — Postly" />
  <title>Article — Postly</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/articles.css" />
</head>
<body class="write-article-page">

  <!-- Reading progress bar -->
  <div class="article-reader-progress" id="reading-progress" aria-hidden="true"></div>

  <!-- MOBILE HEADER -->
  <header class="mobile-header" role="banner">
    <button class="back-btn" onclick="window.history.back()" aria-label="Go back">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="logo-text">Post<span>ly</span></div>
    <div class="header-avatar" id="header-avatar" aria-label="Your profile" role="button" tabindex="0"
      onclick="window.location.href='profile.html'">?</div>
  </header>

  <div class="app-wrapper">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar-left" aria-label="Main navigation">
      <div class="sidebar-logo" role="banner">
        <div class="logo-icon" aria-hidden="true">P</div>
        <div class="logo-text">Post<span>ly</span></div>
      </div>
      <nav class="sidebar-nav" role="navigation" aria-label="Primary navigation">
        <button class="nav-item" onclick="window.location.href='index.html'">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span>Home</span>
        </button>
        <button class="nav-item" onclick="window.location.href='articles.html'">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
          <span>Articles</span>
        </button>
        <button class="nav-item" onclick="window.location.href='write-article.html'">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>
          <span>Write Article</span>
        </button>
        <button class="nav-item" onclick="window.location.href='profile.html'">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <span>Profile</span>
        </button>
      </nav>
      <div class="sidebar-user" onclick="window.location.href='profile.html'" role="button" tabindex="0">
        <div class="user-avatar" id="sidebar-user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
          <div class="sidebar-user-handle" id="sidebar-user-handle">@user</div>
        </div>
      </div>
      <button class="sidebar-logout-btn" onclick="logout()" aria-label="Sign out">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="main-content" role="main" style="margin-right:0">

      <!-- Sticky back bar -->
      <div class="article-reader-header" role="banner">
        <button class="back-btn" onclick="window.history.back()" aria-label="Go back to articles">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span style="font-size:14px;font-weight:500;margin-left:4px;color:var(--color-text-secondary)">Articles</span>
        </button>
        <div id="reader-header-title" style="font-size:14px;font-weight:600;color:var(--color-text-primary);max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none"></div>
        <div style="display:flex;gap:8px" id="reader-header-actions"></div>
      </div>

      <!-- Article content -->
      <div id="article-main-content">
        <div class="spinner" role="status" aria-label="Loading article" style="margin-top:80px"></div>
      </div>

    </main>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <div class="bottom-nav-items">
      <a class="bottom-nav-item" href="index.html"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span>Home</span></a>
      <a class="bottom-nav-item" href="articles.html"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span><span>Articles</span></a>
      <a class="bottom-nav-item create-btn-mobile" href="write-article.html"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
      <a class="bottom-nav-item" href="profile.html"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span>Profile</span></a>
      <a class="bottom-nav-item" href="index.html"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span><span>Feed</span></a>
    </div>
  </nav>

  <div id="toast-container" class="toast-container" role="region" aria-live="assertive"></div>

  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/articles.js"></script>
  <script>
    requireAuth();

    document.addEventListener('DOMContentLoaded', () => {
      initializeSampleData();
      initializeArticles();

      const currentUser = getCurrentUser();
      setupSidebarUser(currentUser);

      const params    = new URLSearchParams(window.location.search);
      const articleId = params.get('id');

      if (!articleId) { showArticleError('No article ID provided.'); return; }

      const article = getArticleById(articleId);
      if (!article)  { showArticleError('Article not found. It may have been deleted.'); return; }

      // Increment view count (skip for own articles and preview)
      if (!params.get('preview') && currentUser && article.authorId !== currentUser.id) {
        const articles = getArticles();
        const a = articles.find(x => x.id === articleId);
        if (a) { a.views = (a.views || 0) + 1; saveArticles(articles); }
      }

      renderArticle(article, currentUser);
      setupReadingProgress();
    });

    function setupSidebarUser(user) {
      if (!user) return;
      const color    = user.avatarColor || getAvatarColor(user.id);
      const initials = getInitials(user.displayName);
      const el = id => document.getElementById(id);
      [el('header-avatar'), el('sidebar-user-avatar')].forEach(e => {
        if (e) { e.textContent = initials; e.style.background = color; }
      });
      if (el('sidebar-user-name'))   el('sidebar-user-name').textContent = user.displayName;
      if (el('sidebar-user-handle')) el('sidebar-user-handle').textContent = '@' + user.handle;
    }

    function showArticleError(msg) {
      document.getElementById('article-main-content').innerHTML = `
        <div class="article-reader" style="padding-top:60px">
          <div class="empty-state">
            <div class="empty-state-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <h3>Article not found</h3>
            <p>${escapeHtml(msg)}</p>
            <a href="articles.html" class="btn btn-primary" style="margin-top:16px">Back to Articles</a>
          </div>
        </div>`;
    }

    function renderArticle(article, currentUser) {
      const author   = getUserById(article.authorId);
      if (!author) { showArticleError('Author not found.'); return; }

      const liked    = currentUser ? hasLikedArticle(article.id, currentUser.id) : false;
      const isOwn    = currentUser && article.authorId === currentUser.id;
      const color    = author.avatarColor || getAvatarColor(author.id);
      const initials = getInitials(author.displayName);
      const comments = getArticleCommentsByArticle(article.id);
      const cuColor  = currentUser ? (currentUser.avatarColor || getAvatarColor(currentUser.id)) : '#6c63ff';
      const cuInit   = currentUser ? getInitials(currentUser.displayName) : '?';

      document.title = `${article.title} — Postly`;

      // Update sticky header
      document.getElementById('reader-header-title').textContent = article.title;

      // Owner actions in header
      if (isOwn) {
        document.getElementById('reader-header-actions').innerHTML = `
          <a href="write-article.html?edit=${article.id}" class="btn btn-outline" style="font-size:12px;padding:6px 12px">Edit</a>
          <button class="btn btn-danger" id="delete-article-btn" style="font-size:12px;padding:6px 12px">Delete</button>`;
        document.getElementById('delete-article-btn').addEventListener('click', () => {
          if (confirm('Delete this article?')) {
            deleteArticle(article.id);
            showToast('Article deleted', 'info');
            setTimeout(() => window.location.href = 'articles.html', 800);
          }
        });
      }

      const tagsHTML = (article.tags || []).map(t =>
        `<span class="article-tag" style="cursor:default">${escapeHtml(t)}</span>`
      ).join('');

      const coverHTML = article.coverImage
        ? `<img src="${article.coverImage}" alt="${escapeHtml(article.title)}" class="article-cover-image" onerror="this.style.display='none'" />`
        : '';

      const container = document.getElementById('article-main-content');
      container.innerHTML = `
        <div class="article-reader">

          <!-- Hero -->
          <header class="article-hero">
            <div class="article-hero-tags">${tagsHTML}</div>
            <h1 class="article-hero-title">${escapeHtml(article.title)}</h1>
            ${article.subtitle ? `<p class="article-hero-subtitle">${escapeHtml(article.subtitle)}</p>` : ''}

            <div class="article-hero-meta">
              <a href="profile.html?user=${author.id}" class="article-hero-author" aria-label="View ${escapeHtml(author.displayName)}'s profile">
                <div class="article-hero-avatar" style="background:${color}">${initials}</div>
                <div>
                  <div class="article-hero-author-name">${escapeHtml(author.displayName)}</div>
                  <div class="article-hero-author-date">${formatFullDate(article.createdAt)}${article.updatedAt && article.updatedAt !== article.createdAt ? ' &middot; Updated' : ''}</div>
                </div>
              </a>
              <div class="article-hero-stats">
                <span class="article-hero-stat">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  ${escapeHtml(article.readTime)}
                </span>
                <span class="article-hero-stat">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  ${formatCount(article.views || 0)} views
                </span>
              </div>
            </div>
          </header>

          <!-- Cover image -->
          ${coverHTML}

          <!-- Body -->
          <div class="article-body" id="article-body-content">
            ${renderArticleContent(article.content)}
          </div>

          <!-- Action bar -->
          <div class="article-action-bar">
            <div class="article-action-bar-left">
              <button class="article-bar-btn ${liked ? 'liked' : ''}" id="reader-like-btn" aria-pressed="${liked}" aria-label="${liked ? 'Unlike' : 'Like'} article">
                <span id="reader-like-icon">${liked ? icon('heartFilled') : icon('heart')}</span>
                <span id="reader-like-count">${formatCount(article.likes)}</span> Likes
              </button>
              <button class="article-bar-btn" id="reader-comment-jump" aria-label="Jump to comments">
                ${icon('messageCircle')}
                <span>${formatCount(comments.length)}</span> Comments
              </button>
            </div>
            <div class="article-action-bar-right">
              <button class="article-bar-btn" id="reader-share-btn" aria-label="Share article">
                ${icon('share')} Share
              </button>
              <button class="article-bar-btn" id="reader-copy-btn" aria-label="Copy link">
                ${icon('link')} Copy link
              </button>
            </div>
          </div>

          <!-- Author card -->
          <div style="background:var(--color-surface-2);border-radius:var(--radius-lg);padding:20px;display:flex;gap:14px;align-items:flex-start;margin-bottom:40px;border:1px solid var(--color-border)">
            <a href="profile.html?user=${author.id}" style="text-decoration:none;flex-shrink:0">
              <div style="width:52px;height:52px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px">${initials}</div>
            </a>
            <div style="flex:1;min-width:0">
              <a href="profile.html?user=${author.id}" style="font-size:15px;font-weight:700;color:var(--color-text-primary);text-decoration:none;display:block;margin-bottom:4px">${escapeHtml(author.displayName)}</a>
              <p style="font-size:13px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:10px">${escapeHtml(author.bio || '')}</p>
              <span style="font-size:12px;color:var(--color-text-muted)">${formatCount(author.followers || 0)} followers</span>
            </div>
          </div>

          <!-- Comments -->
          <section class="article-comments" id="comments" aria-label="Comments">
            <h2 class="article-comments-title">
              Comments
              <span class="article-comments-count" id="comments-count-label">(${comments.length})</span>
            </h2>

            <!-- Comment input -->
            <div class="article-comment-input-wrap">
              <div class="article-comment-avatar" style="background:${cuColor}">${cuInit}</div>
              <div class="article-comment-area">
                <textarea class="article-comment-textarea" id="article-comment-input"
                  placeholder="Share your thoughts on this article..."
                  maxlength="500" rows="2"
                  aria-label="Write a comment"></textarea>
                <div style="display:flex;justify-content:flex-end">
                  <button class="btn btn-primary article-comment-submit-btn" id="article-comment-submit" aria-label="Post comment">
                    ${icon('send', {size: 14})} Comment
                  </button>
                </div>
              </div>
            </div>

            <!-- Comments list -->
            <div id="article-comments-list"></div>
          </section>

        </div>
      `;

      // Render comments
      renderArticleComments(article.id, currentUser);

      // Like button
      document.getElementById('reader-like-btn').addEventListener('click', () => {
        if (!currentUser) { showToast('Log in to like articles', 'warning'); return; }
        const nowLiked = toggleArticleLike(article.id, currentUser.id);
        const articles = getArticles();
        const a = articles.find(x => x.id === article.id);
        if (a) {
          a.likes = nowLiked ? a.likes + 1 : Math.max(0, a.likes - 1);
          saveArticles(articles);
          document.getElementById('reader-like-count').textContent = formatCount(a.likes);
        }
        document.getElementById('reader-like-icon').innerHTML = nowLiked ? icon('heartFilled') : icon('heart');
        const btn = document.getElementById('reader-like-btn');
        btn.classList.toggle('liked', nowLiked);
        btn.setAttribute('aria-pressed', nowLiked);
        showToast(nowLiked ? 'Article liked' : 'Like removed', nowLiked ? 'success' : 'info', 2000);
      });

      // Jump to comments
      document.getElementById('reader-comment-jump').addEventListener('click', () => {
        document.getElementById('comments').scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('article-comment-input').focus();
      });

      // Share
      document.getElementById('reader-share-btn').addEventListener('click', () => {
        const url = `postly.local/article/${article.id}`;
        if (navigator.share) {
          navigator.share({ title: article.title, url: 'https://' + url }).catch(() => {});
        } else {
          copyToClipboard(url).then(ok => showToast(ok ? 'Link copied!' : 'Could not copy', ok ? 'success' : 'error'));
        }
      });

      // Copy link
      document.getElementById('reader-copy-btn').addEventListener('click', () => {
        const url = `postly.local/article/${article.id}`;
        copyToClipboard(url).then(ok => showToast(ok ? 'Link copied!' : 'Could not copy', ok ? 'success' : 'error'));
      });

      // Submit comment
      const commentInput  = document.getElementById('article-comment-input');
      const commentSubmit = document.getElementById('article-comment-submit');

      const doSubmit = () => {
        const text = commentInput.value.trim();
        if (!text)        { showToast('Comment cannot be empty', 'warning'); return; }
        if (!currentUser) { showToast('Log in to comment', 'warning'); return; }

        const comment = {
          id: generateId('ac'),
          articleId: article.id,
          authorId:  currentUser.id,
          text,
          createdAt: new Date().toISOString(),
        };
        addArticleComment(comment);

        // Update article comment count
        const articles = getArticles();
        const a = articles.find(x => x.id === article.id);
        if (a) { a.comments = (a.comments || 0) + 1; saveArticles(articles); }

        commentInput.value = '';
        renderArticleComments(article.id, currentUser);
        showToast('Comment added', 'success', 2000);

        // Scroll to comments list
        document.getElementById('article-comments-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      commentSubmit.addEventListener('click', doSubmit);
      commentInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.ctrlKey) doSubmit();
      });

      // Show sticky title on scroll
      const heroTitle = document.querySelector('.article-hero-title');
      const stickyTitle = document.getElementById('reader-header-title');
      const observer = new IntersectionObserver(([entry]) => {
        stickyTitle.style.display = entry.isIntersecting ? 'none' : 'block';
      }, { threshold: 0 });
      if (heroTitle) observer.observe(heroTitle);
    }

    function renderArticleComments(articleId, currentUser) {
      const container = document.getElementById('article-comments-list');
      const comments  = getArticleCommentsByArticle(articleId);

      // Update count label
      const countLabel = document.getElementById('comments-count-label');
      if (countLabel) countLabel.textContent = `(${comments.length})`;

      if (!comments.length) {
        container.innerHTML = `
          <div style="text-align:center;padding:40px 20px;color:var(--color-text-muted)">
            <div style="margin-bottom:8px;opacity:0.5">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <p style="font-size:14px">No comments yet — start the discussion!</p>
          </div>`;
        return;
      }

      container.innerHTML = '';
      comments.forEach(comment => {
        const author  = getUserById(comment.authorId);
        if (!author) return;
        const isOwn   = currentUser && comment.authorId === currentUser.id;
        const color   = author.avatarColor || getAvatarColor(author.id);
        const initials = getInitials(author.displayName);

        const div = document.createElement('div');
        div.className = 'article-comment-item';
        div.dataset.commentId = comment.id;
        div.innerHTML = `
          <div class="article-comment-avatar" style="background:${color};width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:13px;flex-shrink:0">
            ${initials}
          </div>
          <div class="article-comment-bubble">
            <div class="article-comment-bubble-header">
              <a href="profile.html?user=${author.id}" class="article-comment-author" style="text-decoration:none;color:inherit">${escapeHtml(author.displayName)}</a>
              <span class="article-comment-time">${formatTime(comment.createdAt)}</span>
            </div>
            <p class="article-comment-text">${escapeHtml(comment.text)}</p>
            ${isOwn ? `<button class="article-comment-delete" data-id="${comment.id}" aria-label="Delete comment">Delete</button>` : ''}
          </div>`;

        if (isOwn) {
          div.querySelector('.article-comment-delete').addEventListener('click', () => {
            if (!confirm('Delete this comment?')) return;
            deleteArticleComment(comment.id);

            // Decrement article comment count
            const articles = getArticles();
            const a = articles.find(x => x.id === articleId);
            if (a) { a.comments = Math.max(0, (a.comments || 1) - 1); saveArticles(articles); }

            renderArticleComments(articleId, currentUser);
            showToast('Comment deleted', 'info', 2000);
          });
        }

        container.appendChild(div);
      });
    }

    function setupReadingProgress() {
      const bar = document.getElementById('reading-progress');
      if (!bar) return;
      window.addEventListener('scroll', () => {
        const scrollTop  = window.scrollY;
        const docHeight  = document.documentElement.scrollHeight - window.innerHeight;
        const progress   = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        bar.style.width  = Math.min(progress, 100) + '%';
      }, { passive: true });
    }
  </script>

</body>
</html>
