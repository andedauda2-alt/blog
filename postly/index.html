<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Postly â€” Share ideas. Start conversations." />
  <title>Postly â€” Share ideas. Start conversations.</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ===== MOBILE HEADER ===== -->
  <header class="mobile-header" role="banner">
    <div class="logo-text">Post<span>ly</span></div>
    <div class="header-actions">
      <button class="header-btn" id="mobile-search-toggle" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="header-btn" id="mobile-notif-btn" aria-label="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>
      <div class="header-avatar" id="header-avatar" aria-label="Your profile" role="button" tabindex="0"
        onclick="window.location.href='profile.html'">?</div>
    </div>
  </header>

  <div class="app-wrapper">

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar-left" aria-label="Main navigation">

      <div class="sidebar-logo" role="banner">
        <div class="logo-icon" aria-hidden="true">P</div>
        <div class="logo-text">Post<span>ly</span></div>
      </div>

      <nav class="sidebar-nav" role="navigation" aria-label="Primary navigation">
        <button class="nav-item active" data-page="home" aria-label="Home feed">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span>Home</span>
        </button>
        <button class="nav-item" data-page="explore" aria-label="Explore">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <span>Explore</span>
        </button>
        <button class="nav-item" data-page="notifications" aria-label="Notifications">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
          <span>Notifications</span>
          <span class="nav-badge hidden notif-badge" aria-label="notifications">3</span>
        </button>
        <button class="nav-item" onclick="window.location.href='create.html'" aria-label="Create post">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>
          <span>Create Post</span>
        </button>
        <button class="nav-item" onclick="window.location.href='profile.html'" aria-label="Your profile">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <span>Profile</span>
        </button>
      </nav>

      <!-- User card -->
      <div class="sidebar-user" onclick="window.location.href='profile.html'" role="button" tabindex="0"
        aria-label="View your profile">
        <div class="user-avatar" id="sidebar-user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
          <div class="sidebar-user-handle" id="sidebar-user-handle">@user</div>
        </div>
      </div>

      <!-- Logout -->
      <button class="sidebar-logout-btn" onclick="logout()" aria-label="Sign out">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>

    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="main-content" role="main">

      <!-- Feed Header -->
      <div class="feed-header" role="banner">
        <h1>Home Feed</h1>
        <div class="header-actions">
          <button class="header-btn" id="desktop-notif-btn" aria-label="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notification-dot" aria-hidden="true"></span>
          </button>
          <div class="header-avatar" id="header-avatar-desktop" role="button" tabindex="0"
            aria-label="Your profile" onclick="window.location.href='profile.html'">?</div>
        </div>
      </div>

      <div class="feed-container">

        <!-- Search Bar -->
        <section class="search-bar-container" aria-label="Search posts">
          <div class="search-bar" role="search">
            <span class="search-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="search" id="search-input"
              placeholder="Search posts, people, topics..."
              aria-label="Search posts, people, and topics"
              autocomplete="off" />
            <button class="search-clear-btn" id="search-clear-btn" aria-label="Clear search">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="search-results-label" id="search-results-label" role="status" aria-live="polite"></div>
        </section>

        <!-- Create Post Card -->
        <section class="create-post-card" aria-label="Create a new post">
          <div class="create-post-top">
            <div class="create-post-avatar" id="create-post-avatar" aria-hidden="true">?</div>
            <div class="create-post-input-wrap">
              <textarea id="create-post-textarea" class="create-post-textarea"
                placeholder="What's on your mind?"
                aria-label="Write a new post" maxlength="500" rows="3"></textarea>
              <div class="image-preview-wrap" id="image-preview-wrap">
                <img id="image-preview-img" src="" alt="Post image preview" />
                <button class="remove-image-btn" id="remove-image-btn" aria-label="Remove image">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
              <div class="error-message" id="create-post-error" role="alert"></div>
            </div>
          </div>

          <div class="create-post-divider" aria-hidden="true"></div>

          <div class="create-post-actions">
            <div class="create-post-tools">
              <label class="create-post-tool-btn" for="image-upload" title="Add image" aria-label="Add image">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <input type="file" id="image-upload" accept="image/*" style="display:none" aria-label="Upload image" />
              </label>
              <button class="create-post-tool-btn" title="Add symbol" aria-label="Add symbol" onclick="insertSymbol()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
              </button>
            </div>
            <div class="create-post-right">
              <span class="char-counter" id="char-counter" aria-live="polite" aria-label="Characters remaining">500</span>
              <button class="btn btn-primary" id="publish-btn" aria-label="Publish post">Publish</button>
            </div>
          </div>
        </section>

        <!-- Posts Feed -->
        <section aria-label="Posts feed" aria-live="polite">
          <div id="posts-feed">
            <div class="spinner" role="status" aria-label="Loading posts"></div>
          </div>
        </section>

      </div>
    </main>

    <!-- ===== RIGHT SIDEBAR ===== -->
    <aside class="sidebar-right" aria-label="Trending and suggestions">

      <section class="sidebar-section">
        <h2 class="sidebar-section-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Trending Topics
        </h2>
        <div id="trending-topics" role="list"></div>
      </section>

      <section class="sidebar-section">
        <h2 class="sidebar-section-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Suggested for You
        </h2>
        <div id="suggested-users" role="list"></div>
      </section>

      <section class="sidebar-section">
        <h2 class="sidebar-section-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Popular Today
        </h2>
        <div id="popular-posts">
          <p style="font-size:13px;color:var(--color-text-muted)">Check back often for the most-liked posts of the day.</p>
        </div>
      </section>

      <footer style="font-size:11px;color:var(--color-text-muted);line-height:1.6">
        <p>Â© 2026 Postly Â· <a href="#" style="color:var(--color-primary)">About</a> Â· <a href="#" style="color:var(--color-primary)">Privacy</a></p>
        <p style="margin-top:4px">Built with care using vanilla HTML, CSS &amp; JS</p>
      </footer>

    </aside>

  </div><!-- end app-wrapper -->

  <!-- ===== BOTTOM NAV (Mobile) ===== -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <div class="bottom-nav-items">
      <a class="bottom-nav-item active" href="index.html" data-page="home" aria-label="Home">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>Home</span>
      </a>
      <a class="bottom-nav-item" href="index.html#search" data-page="explore" aria-label="Explore"
        onclick="event.preventDefault(); document.getElementById('search-input').focus(); document.querySelector('.search-bar-container').scrollIntoView({behavior:'smooth',block:'start'});">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <span>Explore</span>
      </a>
      <a class="bottom-nav-item create-btn-mobile" href="create.html" aria-label="Create new post">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
      <a class="bottom-nav-item" href="profile.html" data-page="profile" aria-label="Your profile">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>Profile</span>
      </a>
      <a class="bottom-nav-item" href="#" data-page="notifications" aria-label="Notifications"
        onclick="event.preventDefault(); showToast('Notifications coming soon!', 'info')">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
        <span>Alerts</span>
      </a>
    </div>
  </nav>

  <div id="toast-container" class="toast-container" role="region" aria-live="assertive" aria-label="Notifications"></div>

  <!-- ===== Scripts ===== -->
  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Auth guard â€” redirect to login if not signed in
    requireAuth();

    function insertSymbol() {
      const ta = document.getElementById('create-post-textarea');
      if (ta) {
        const symbols = ['*', '->', '...', 'â€”', '#', '@', '&', '+', '>>'];
        const sym = symbols[Math.floor(Math.random() * symbols.length)];
        const pos = ta.selectionStart || ta.value.length;
        ta.value = ta.value.slice(0, pos) + sym + ta.value.slice(pos);
        ta.dispatchEvent(new Event('input'));
        ta.focus();
      }
    }

    document.getElementById('mobile-search-toggle').addEventListener('click', () => {
      const searchContainer = document.querySelector('.search-bar-container');
      searchContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.getElementById('search-input').focus();
    });
  </script>

</body>
</html>
