<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to Postly" />
  <title>Sign In — Postly</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">

  <div class="auth-card" role="main">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="logo-icon">P</div>
      <div class="logo-text">Post<span>ly</span></div>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue sharing ideas</p>

    <!-- Error banner -->
    <div class="auth-error-banner" id="login-error" role="alert" aria-live="assertive">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span id="login-error-text"></span>
    </div>

    <form id="login-form" novalidate>

      <!-- Username -->
      <div class="auth-form-group">
        <label class="auth-label" for="login-handle">Username</label>
        <div class="auth-input-wrap">
          <span class="auth-input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <input
            type="text"
            id="login-handle"
            class="auth-input"
            placeholder="your_username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            aria-required="true"
            aria-describedby="login-handle-error"
          />
        </div>
        <div class="auth-field-error" id="login-handle-error" role="alert"></div>
      </div>

      <!-- Password -->
      <div class="auth-form-group">
        <label class="auth-label" for="login-password">Password</label>
        <div class="auth-input-wrap">
          <span class="auth-input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input
            type="password"
            id="login-password"
            class="auth-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            aria-required="true"
            aria-describedby="login-password-error"
          />
          <button type="button" class="password-toggle" id="toggle-login-password" aria-label="Show password">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="auth-field-error" id="login-password-error" role="alert"></div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary auth-submit-btn" id="login-btn">
        Sign In
      </button>

    </form>

    <div class="auth-divider">or</div>

    <!-- Demo login hint -->
    <div style="background:var(--color-primary-light);border-radius:var(--radius-md);padding:14px 16px;font-size:13px;color:var(--color-text-secondary);margin-bottom:4px">
      <strong style="color:var(--color-primary);display:block;margin-bottom:6px">Try a demo account</strong>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span>Username: <strong>andedauda</strong> &nbsp;|&nbsp; Password: <strong>demo123</strong></span>
        <span>Username: <strong>sarahcodes</strong> &nbsp;|&nbsp; Password: <strong>demo123</strong></span>
      </div>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one</a>
    </div>

  </div>

  <!-- Scripts — no app.js needed on auth pages -->
  <script src="js/storage.js"></script>
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Seed sample data so demo accounts exist
      initializeSampleData();
      // Seed demo passwords for sample users if not already set
      seedDemoPasswords();
      // If already logged in, go straight to feed
      redirectIfLoggedIn();
    });

    /**
     * Give every sample user the demo password "demo123"
     * so the demo login hint on this page actually works.
     */
    function seedDemoPasswords() {
      const creds = getCredentials();
      const users = getUsers();
      let changed = false;
      users.forEach(user => {
        if (!creds[user.handle]) {
          creds[user.handle] = hashPassword('demo123');
          changed = true;
        }
      });
      if (changed) saveCredentials(creds);
    }

    // Password toggle
    document.getElementById('toggle-login-password').addEventListener('click', () => {
      const input = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      // Swap eye / eye-off icon
      eyeIcon.outerHTML = isHidden
        ? `<svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      document.getElementById('toggle-login-password').setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });

    // Form submit
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();

      // Clear previous errors
      clearFormError('login-handle-error');
      clearFormError('login-password-error');
      setFieldError('login-handle', false);
      setFieldError('login-password', false);
      document.getElementById('login-error').classList.remove('visible');

      const handle   = document.getElementById('login-handle').value.trim();
      const password = document.getElementById('login-password').value;

      // Basic validation
      let hasError = false;
      if (!handle) {
        showFormError('login-handle-error', 'Username is required.');
        setFieldError('login-handle', true);
        hasError = true;
      }
      if (!password) {
        showFormError('login-password-error', 'Password is required.');
        setFieldError('login-password', true);
        hasError = true;
      }
      if (hasError) return;

      // Loading state
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Signing in...';
      btn.classList.add('loading');

      // Small delay to feel intentional
      setTimeout(() => {
        const result = loginUser(handle, password);

        if (result.success) {
          window.location.replace('index.html');
        } else {
          btn.textContent = 'Sign In';
          btn.classList.remove('loading');
          const banner = document.getElementById('login-error');
          document.getElementById('login-error-text').textContent = result.error;
          banner.classList.add('visible');
          // Highlight the right field
          if (result.error.includes('username') || result.error.includes('account')) {
            setFieldError('login-handle', true);
          } else {
            setFieldError('login-password', true);
          }
        }
      }, 400);
    });

    // Clear errors on input
    ['login-handle', 'login-password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        clearFormError(id + '-error');
        setFieldError(id, false);
        document.getElementById('login-error').classList.remove('visible');
      });
    });
  </script>

</body>
</html>
