<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Articles — Postly" />
  <title>Articles — Postly</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/articles.css" />
</head>
<body>

  <!-- ===== MOBILE HEADER ===== -->
  <header class="mobile-header" role="banner">
    <div class="logo-text">Post<span>ly</span></div>
    <div class="header-actions">
      <a href="write-article.html" class="header-btn" aria-label="Write article" style="display:flex;align-items:center;justify-content:center;text-decoration:none">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </a>
      <div class="header-avatar" id="header-avatar" aria-label="Your profile" role="button" tabindex="0"
        onclick="window.location.href='profile.html'">?</div>
    </div>
  </header>

  <div class="app-wrapper">

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar-left" aria-label="Main navigation">
      <div class="sidebar-logo" role="banner">
        <div class="logo-icon" aria-hidden="true">P</div>
        <div class="logo-text">Post<span>ly</span></div>
      </div>
      <nav class="sidebar-nav" role="navigation" aria-label="Primary navigation">
        <button class="nav-item" onclick="window.location.href='index.html'" aria-label="Home feed">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span>Home</span>
        </button>
        <button class="nav-item" onclick="window.location.href='index.html'" aria-label="Explore">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <span>Explore</span>
        </button>
        <button class="nav-item active" aria-label="Articles" aria-current="page">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
          <span>Articles</span>
        </button>
        <button class="nav-item" onclick="window.location.href='write-article.html'" aria-label="Write article">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>
          <span>Write Article</span>
        </button>
        <button class="nav-item" onclick="window.location.href='profile.html'" aria-label="Profile">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <span>Profile</span>
        </button>
      </nav>
      <div class="sidebar-user" onclick="window.location.href='profile.html'" role="button" tabindex="0">
        <div class="user-avatar" id="sidebar-user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
          <div class="sidebar-user-handle" id="sidebar-user-handle">@user</div>
        </div>
      </div>
      <button class="sidebar-logout-btn" onclick="logout()" aria-label="Sign out">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="main-content" role="main">

      <!-- Feed Header -->
      <div class="feed-header" role="banner">
        <h1>Articles</h1>
        <div class="header-actions">
          <a href="write-article.html" class="btn btn-primary" style="font-size:13px;padding:8px 16px;gap:6px;text-decoration:none" aria-label="Write a new article">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Write
          </a>
        </div>
      </div>

      <div class="feed-container">

        <!-- Search -->
        <section class="search-bar-container" aria-label="Search articles">
          <div class="search-bar" role="search">
            <span class="search-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="search" id="article-search-input"
              placeholder="Search articles, authors, topics..."
              aria-label="Search articles" autocomplete="off" />
            <button class="search-clear-btn" id="article-search-clear" aria-label="Clear search">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="search-results-label" id="article-search-label" role="status" aria-live="polite"></div>
        </section>

        <!-- Category Tabs -->
        <div class="article-category-tabs" role="tablist" aria-label="Filter by category" id="category-tabs"></div>

        <!-- Articles Feed -->
        <section aria-label="Articles" aria-live="polite">
          <div id="articles-feed">
            <div class="spinner" role="status" aria-label="Loading articles"></div>
          </div>
        </section>

      </div>
    </main>

    <!-- ===== RIGHT SIDEBAR ===== -->
    <aside class="sidebar-right" aria-label="Articles sidebar">

      <!-- Write CTA -->
      <div class="write-cta-card">
        <div class="write-cta-title">Share your knowledge</div>
        <p class="write-cta-text">Write an in-depth article and reach thousands of readers.</p>
        <a href="write-article.html" class="write-cta-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Write Article
        </a>
      </div>

      <!-- Popular Articles -->
      <section class="sidebar-section articles-sidebar-section">
        <h2 class="articles-sidebar-title">Most Popular</h2>
        <div id="popular-articles-list"></div>
      </section>

      <!-- Topics -->
      <section class="sidebar-section articles-sidebar-section">
        <h2 class="articles-sidebar-title">Trending Topics</h2>
        <div id="trending-article-tags" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </section>

    </aside>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <div class="bottom-nav-items">
      <a class="bottom-nav-item" href="index.html" aria-label="Home">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>Home</span>
      </a>
      <a class="bottom-nav-item active" href="articles.html" aria-label="Articles" aria-current="page">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
        <span>Articles</span>
      </a>
      <a class="bottom-nav-item create-btn-mobile" href="write-article.html" aria-label="Write article">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
      <a class="bottom-nav-item" href="profile.html" aria-label="Profile">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>Profile</span>
      </a>
      <a class="bottom-nav-item" href="index.html" aria-label="Feed">
        <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
        <span>Feed</span>
      </a>
    </div>
  </nav>

  <div id="toast-container" class="toast-container" role="region" aria-live="assertive"></div>

  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/articles.js"></script>
  <script>
    requireAuth();

    let activeCategory = 'all';
    let allArticles    = [];

    document.addEventListener('DOMContentLoaded', () => {
      initializeSampleData();
      initializeArticles();

      const currentUser = getCurrentUser();
      setupUserUI(currentUser);

      allArticles = getArticles().filter(a => a.status === 'published')
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      renderCategoryTabs();
      renderFeedArticles(allArticles, currentUser);
      renderPopularArticles();
      renderTrendingTags();
      setupArticleSearch(currentUser);
    });

    function setupUserUI(user) {
      if (!user) return;
      const initials = getInitials(user.displayName);
      const color    = user.avatarColor || getAvatarColor(user.id);
      const el = id => document.getElementById(id);
      if (el('header-avatar'))       { el('header-avatar').textContent = initials; el('header-avatar').style.background = color; }
      if (el('sidebar-user-avatar')) { el('sidebar-user-avatar').textContent = initials; el('sidebar-user-avatar').style.background = color; }
      if (el('sidebar-user-name'))   el('sidebar-user-name').textContent = user.displayName;
      if (el('sidebar-user-handle')) el('sidebar-user-handle').textContent = '@' + user.handle;
    }

    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = ARTICLE_CATEGORIES.map(cat => `
        <button class="article-category-btn${cat.id === activeCategory ? ' active' : ''}"
          data-category="${cat.id}" role="tab"
          aria-selected="${cat.id === activeCategory}"
          aria-label="Filter: ${cat.label}">
          ${escapeHtml(cat.label)}
        </button>`).join('');

      container.querySelectorAll('.article-category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.category;
          container.querySelectorAll('.article-category-btn').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          filterAndRender();
        });
      });
    }

    function filterAndRender() {
      const currentUser = getCurrentUser();
      const searchVal   = document.getElementById('article-search-input').value.toLowerCase().trim();
      let filtered = allArticles;

      // Category filter
      if (activeCategory !== 'all') {
        const catTagMap = {
          tech:        ['#tech', '#technology', '#webdev', '#javascript', '#css', '#frontend', '#backend', '#engineering', '#programming'],
          career:      ['#career', '#leadership', '#softskills'],
          business:    ['#startup', '#business', '#entrepreneurship', '#productmanagement'],
          ai:          ['#ai', '#llm', '#machinelearning', '#ml'],
          programming: ['#programming', '#javascript', '#css', '#webdev', '#frontend', '#cleancode', '#softwareengineering'],
          design:      ['#design', '#ux', '#ui', '#css'],
        };
        const catTags = catTagMap[activeCategory] || [];
        filtered = filtered.filter(a =>
          (a.tags || []).some(t => catTags.includes(t.toLowerCase()))
        );
      }

      // Search filter
      if (searchVal) {
        const users = getUsers();
        filtered = filtered.filter(a => {
          if (a.title.toLowerCase().includes(searchVal)) return true;
          if ((a.subtitle || '').toLowerCase().includes(searchVal)) return true;
          if (a.content.toLowerCase().includes(searchVal)) return true;
          if ((a.tags || []).some(t => t.toLowerCase().includes(searchVal))) return true;
          const author = users.find(u => u.id === a.authorId);
          if (author && author.displayName.toLowerCase().includes(searchVal)) return true;
          return false;
        });
        const lbl = document.getElementById('article-search-label');
        lbl.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''} for "${searchVal}"`;
        lbl.classList.add('visible');
      } else {
        document.getElementById('article-search-label').classList.remove('visible');
      }

      renderFeedArticles(filtered, getCurrentUser());
    }

    function renderFeedArticles(articles, currentUser) {
      const feed = document.getElementById('articles-feed');
      feed.innerHTML = '';

      if (!articles.length) {
        feed.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <h3>No articles found</h3>
            <p>Try a different filter or <a href="write-article.html" style="color:var(--color-primary)">write the first one</a>.</p>
          </div>`;
        return;
      }

      articles.forEach((article, idx) => {
        const card = buildArticleCard(article, currentUser);
        if (!card) return;
        if (idx === 0) card.classList.add('article-featured');
        feed.appendChild(card);
      });
    }

    function renderPopularArticles() {
      const container = document.getElementById('popular-articles-list');
      const popular   = [...allArticles].sort((a, b) => b.likes - a.likes).slice(0, 5);
      container.innerHTML = popular.map((a, i) => {
        const author = getUserById(a.authorId);
        return `
          <a href="article.html?id=${a.id}" class="popular-article-item" aria-label="${escapeHtml(a.title)}">
            <span class="popular-article-num">0${i + 1}</span>
            <div class="popular-article-info">
              <div class="popular-article-title">${escapeHtml(a.title)}</div>
              <div class="popular-article-meta">${author ? escapeHtml(author.displayName) : 'Unknown'} &middot; ${formatCount(a.likes)} likes</div>
            </div>
          </a>`;
      }).join('');
    }

    function renderTrendingTags() {
      const container  = document.getElementById('trending-article-tags');
      const tagCounts  = {};
      allArticles.forEach(a => (a.tags || []).forEach(t => {
        tagCounts[t] = (tagCounts[t] || 0) + 1;
      }));
      const sorted = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 12);
      container.innerHTML = sorted.map(([tag]) => `
        <button class="article-tag" onclick="filterByTag('${escapeHtml(tag)}')" aria-label="Filter by ${escapeHtml(tag)}">
          ${escapeHtml(tag)}
        </button>`).join('');
    }

    function filterByTag(tag) {
      const input = document.getElementById('article-search-input');
      input.value = tag.replace('#', '');
      input.dispatchEvent(new Event('input'));
    }

    function setupArticleSearch(currentUser) {
      const input    = document.getElementById('article-search-input');
      const clearBtn = document.getElementById('article-search-clear');
      let timer;

      input.addEventListener('input', () => {
        clearBtn.classList.toggle('visible', input.value.length > 0);
        clearTimeout(timer);
        timer = setTimeout(filterAndRender, 300);
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        clearBtn.classList.remove('visible');
        document.getElementById('article-search-label').classList.remove('visible');
        filterAndRender();
        input.focus();
      });
    }
  </script>

</body>
</html>
